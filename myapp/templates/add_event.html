<!DOCTYPE html>
<html>
<head>
    <title>Add New Event</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .event-container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .event-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.25);
        }

        .add-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.35);
        }

        .back-btn {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div class="event-container">

        <div class="icon">📅</div>

        <h1>Add New Event</h1>

        <p class="subtitle">
            Create an event and start your countdown
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Event Name</label>
                <input type="text"
                       name="Event_name"
                       placeholder="Enter event name"
                       required>
            </div>

            <div class="form-group">
                <label>Event Date</label>
                <input type="date"
                       name="date"
                       required>
            </div>

            <div class="form-group">
                <label>Event Time</label>
                <input type="time"
                       name="time"
                       required>
            </div>

            <button type="submit" class="add-btn">
                Add Event
            </button>

        </form>

        <a href="{% url 'home' %}" class="back-btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
